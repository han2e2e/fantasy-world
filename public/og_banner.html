<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1200"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #08040f; font-family: 'Noto Serif KR', serif; }

  .banner {
    position: relative;
    width: 1200px;
    height: 630px;
    background: radial-gradient(ellipse at 30% 50%, #2a1060 0%, #110828 40%, #06030e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 8%  15%, rgba(255,255,255,0.55) 0%, transparent 100%),
      radial-gradient(1px   1px   at 18% 72%, rgba(255,255,255,0.35) 0%, transparent 100%),
      radial-gradient(2px   2px   at 28%  8%, rgba(255,220,150,0.5)  0%, transparent 100%),
      radial-gradient(1px   1px   at 42% 88%, rgba(255,255,255,0.4)  0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 55% 22%, rgba(255,255,255,0.5)  0%, transparent 100%),
      radial-gradient(1px   1px   at 65% 65%, rgba(255,255,255,0.3)  0%, transparent 100%),
      radial-gradient(2px   2px   at 75% 12%, rgba(255,220,150,0.45) 0%, transparent 100%),
      radial-gradient(1px   1px   at 85% 78%, rgba(255,255,255,0.45) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 92% 40%, rgba(255,255,255,0.35) 0%, transparent 100%),
      radial-gradient(1px   1px   at 12% 45%, rgba(200,180,255,0.4)  0%, transparent 100%),
      radial-gradient(1px   1px   at 48% 55%, rgba(200,180,255,0.3)  0%, transparent 100%),
      radial-gradient(2px   2px   at 70% 90%, rgba(255,220,150,0.4)  0%, transparent 100%),
      radial-gradient(1px   1px   at 33% 33%, rgba(255,255,255,0.3)  0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 80% 55%, rgba(255,255,255,0.4)  0%, transparent 100%),
      radial-gradient(1px   1px   at 95% 20%, rgba(200,180,255,0.35) 0%, transparent 100%);
  }

  .glow-left {
    position: absolute; left: -120px; top: 50%; transform: translateY(-50%);
    width: 560px; height: 560px;
    background: radial-gradient(circle, rgba(100,50,200,0.3) 0%, transparent 70%);
  }
  .glow-right {
    position: absolute; right: -80px; top: 50%; transform: translateY(-50%);
    width: 440px; height: 440px;
    background: radial-gradient(circle, rgba(200,146,26,0.16) 0%, transparent 70%);
  }
  .glow-center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 800px; height: 400px;
    background: radial-gradient(ellipse, rgba(60,20,120,0.25) 0%, transparent 65%);
  }

  .magic-circle-bg {
    position: absolute;
    left: -80px; top: 50%; transform: translateY(-50%);
    width: 700px; height: 700px;
    opacity: 0.14;
    pointer-events: none;
  }

  .content {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0; width: 100%; padding: 0 100px;
  }

  .sub-line {
    font-size: 24px; font-weight: 300; letter-spacing: 0.48em;
    background: linear-gradient(180deg, #e8c96a 0%, #a07820 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 20px; opacity: 0.88; text-indent: 0.48em;
  }

  .divider {
    display: flex; align-items: center; gap: 14px;
    width: 100%; max-width: 660px; margin-bottom: 24px;
  }
  .divider-bottom { margin-top: 24px; margin-bottom: 26px; }
  .divider-line {
    flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, #c8921a, transparent);
  }
  .divider-diamond {
    width: 9px; height: 9px; background: #f5c842;
    transform: rotate(45deg); box-shadow: 0 0 10px rgba(245,200,66,0.7);
  }

  .main-title {
    font-size: 114px; font-weight: 900; letter-spacing: 0.15em;
    line-height: 1.15; padding: 0.05em 0.1em;
    background: linear-gradient(180deg, #fff9e6 0%, #f5c842 22%, #d4950f 52%, #8b5e0a 78%, #5a3a00 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    text-align: center;
    filter: drop-shadow(0 6px 28px rgba(0,0,0,0.95)) drop-shadow(0 0 40px rgba(200,146,26,0.2));
  }

  .ability-tag {
    font-size: 16px; font-weight: 400; letter-spacing: 0.58em;
    color: #9d6ecf; text-transform: uppercase; text-indent: 0.58em;
    margin-bottom: 12px; opacity: 0.82;
  }
  .eng-sub {
    font-size: 14px; font-weight: 300; letter-spacing: 0.4em;
    text-indent: 0.4em; text-align: center;
    background: linear-gradient(90deg, #c8921a, #f5c842, #c8921a);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    opacity: 0.52;
  }

  .goddess-badge {
    position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    font-size: 13px; font-weight: 300; letter-spacing: 0.32em;
    color: rgba(200,180,230,0.38); text-indent: 0.32em; white-space: nowrap;
  }
  .badge-line {
    display: inline-block; width: 40px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,180,230,0.28));
  }
  .badge-line-r {
    display: inline-block; width: 40px; height: 1px;
    background: linear-gradient(90deg, rgba(200,180,230,0.28), transparent);
  }

  .corner { position: absolute; width: 30px; height: 30px; }
  .corner--tl { top: 30px; left: 30px; border-top: 1px solid rgba(232,201,106,0.32); border-left: 1px solid rgba(232,201,106,0.32); }
  .corner--tr { top: 30px; right: 30px; border-top: 1px solid rgba(232,201,106,0.32); border-right: 1px solid rgba(232,201,106,0.32); }
  .corner--bl { bottom: 30px; left: 30px; border-bottom: 1px solid rgba(232,201,106,0.32); border-left: 1px solid rgba(232,201,106,0.32); }
  .corner--br { bottom: 30px; right: 30px; border-bottom: 1px solid rgba(232,201,106,0.32); border-right: 1px solid rgba(232,201,106,0.32); }

  .side-line-l, .side-line-r {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 1px; height: 340px;
    background: linear-gradient(180deg, transparent, rgba(232,201,106,0.22), transparent);
  }
  .side-line-l { left: 60px; }
  .side-line-r { right: 60px; }
</style>
</head>
<body>
<div class="banner">
  <div class="stars"></div>
  <div class="glow-left"></div>
  <div class="glow-right"></div>
  <div class="glow-center"></div>

  <!-- 배경 마법진 -->
  <svg class="magic-circle-bg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <circle cx="200" cy="200" r="192" fill="none" stroke="#f5c842" stroke-width="0.8"/>
    <circle cx="200" cy="200" r="158" fill="none" stroke="#f5c842" stroke-width="0.5" stroke-dasharray="6 4"/>
    <circle cx="200" cy="200" r="118" fill="none" stroke="#f5c842" stroke-width="0.6"/>
    <circle cx="200" cy="200" r="78"  fill="none" stroke="#f5c842" stroke-width="0.4" stroke-dasharray="3 3"/>
    <circle cx="200" cy="200" r="44"  fill="none" stroke="#f5c842" stroke-width="0.5"/>
    <line x1="200" y1="8"   x2="200" y2="80"  stroke="#f5c842" stroke-width="0.5"/>
    <line x1="200" y1="320" x2="200" y2="392" stroke="#f5c842" stroke-width="0.5"/>
    <line x1="8"   y1="200" x2="80"  y2="200" stroke="#f5c842" stroke-width="0.5"/>
    <line x1="320" y1="200" x2="392" y2="200" stroke="#f5c842" stroke-width="0.5"/>
    <line x1="54"  y1="54"  x2="106" y2="106" stroke="#f5c842" stroke-width="0.4"/>
    <line x1="346" y1="54"  x2="294" y2="106" stroke="#f5c842" stroke-width="0.4"/>
    <line x1="54"  y1="346" x2="106" y2="294" stroke="#f5c842" stroke-width="0.4"/>
    <line x1="346" y1="346" x2="294" y2="294" stroke="#f5c842" stroke-width="0.4"/>
    <ellipse cx="200" cy="200" rx="50" ry="29" fill="none" stroke="#f5c842" stroke-width="1.4"/>
    <circle cx="200" cy="200" r="18" fill="#f5c842" opacity="0.55"/>
    <circle cx="200" cy="200" r="8"  fill="#08040f"/>
    <circle cx="200" cy="8"   r="3.5" fill="#f5c842" opacity="0.55"/>
    <circle cx="392" cy="200" r="3.5" fill="#f5c842" opacity="0.55"/>
    <circle cx="200" cy="392" r="3.5" fill="#f5c842" opacity="0.55"/>
    <circle cx="8"   cy="200" r="3.5" fill="#f5c842" opacity="0.55"/>
    <circle cx="54"  cy="54"  r="2.5" fill="#f5c842" opacity="0.4"/>
    <circle cx="346" cy="54"  r="2.5" fill="#f5c842" opacity="0.4"/>
    <circle cx="54"  cy="346" r="2.5" fill="#f5c842" opacity="0.4"/>
    <circle cx="346" cy="346" r="2.5" fill="#f5c842" opacity="0.4"/>
  </svg>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>
  <div class="side-line-l"></div>
  <div class="side-line-r"></div>

  <div class="content">
    <p class="sub-line">성향으로 알아보는 이세계</p>
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line"></div>
    </div>
    <div class="main-title">이능력 찾기</div>
    <div class="divider divider-bottom">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line"></div>
    </div>
    <p class="ability-tag">personality &nbsp;·&nbsp; ability &nbsp;·&nbsp; RPG</p>
    <p class="eng-sub">find the ability that's written in your soul</p>
  </div>

  <div class="goddess-badge">
    <span class="badge-line"></span>
    여신의 문답을 통해 당신의 이능력을 각성하세요
    <span class="badge-line-r"></span>
  </div>
</div>
</body>
</html>
