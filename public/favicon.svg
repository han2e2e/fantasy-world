<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crownGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4" />
      <stop offset="35%" stop-color="#f5c842" />
      <stop offset="70%" stop-color="#d4950f" />
      <stop offset="100%" stop-color="#a06b12" />
    </linearGradient>
    <radialGradient id="crownBg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#241441" />
      <stop offset="100%" stop-color="#0a0612" />
    </radialGradient>
    <filter id="crownGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 다크 라운드 스퀘어 배경 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#crownBg)" stroke="#e8c96a" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- 황금 왕관 -->
  <g filter="url(#crownGlow)">
    <path
      d="M14 44 L12 24 L24 33 L32 18 L40 33 L52 24 L50 44 Z"
      fill="url(#crownGold)"
      stroke="#7a5208"
      stroke-width="1.2"
      stroke-linejoin="round"
    />
    <!-- 왕관 받침대 -->
    <rect x="14" y="44" width="36" height="6" rx="2" fill="url(#crownGold)" stroke="#7a5208" stroke-width="1.2" />

    <!-- 보석 (왕관 꼭짓점) -->
    <circle cx="12" cy="22" r="2.6" fill="#ff5d8f" stroke="#fff3c4" stroke-width="0.6" />
    <circle cx="32" cy="16" r="3" fill="#9d6ecf" stroke="#fff3c4" stroke-width="0.7" />
    <circle cx="52" cy="22" r="2.6" fill="#60b8ff" stroke="#fff3c4" stroke-width="0.6" />

    <!-- 받침대 중앙 보석 -->
    <circle cx="32" cy="47" r="2.2" fill="#ff0057" stroke="#fff3c4" stroke-width="0.5" />
  </g>
</svg>
